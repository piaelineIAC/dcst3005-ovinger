name: ci

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read           

jobs:
  kontroll:
    # Nytt navn: jobben gjør mer enn fmt og validate nå. Dette er navnet du
    # velger som required status check i branch protection (Steg 5).
    name: kodekontroll
    runs-on: ubuntu-latest

    # Fortsatt ingen environment, ingen Azure/login, ingen secrets.
    # Alle fire kontrollene er offline.
    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      # --- Installer verktøyene, med låste versjoner ---------------------
      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0

      - name: Installer TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer Checkov
        run: pip install checkov==3.3.21

      # --- Kjør kontrollene: det samme skriptet som du kjører lokalt ------
      - name: Kjør valider.sh
        # Stien regnes fra rota av repoet, som alle stier i en workflow.
        run: bash oving7/scripts/valider.sh
        env:
          # tflint --init laster ned Azure-pluginen fra GitHub. Med token
          # slipper du «rate limit» når mange kjører samtidig.
          GITHUB_TOKEN: ${{ github.token }}
  plan:
    name: plan mot dev
    needs: kontroll
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        shell: bash
        working-directory: oving6/stacks/nettverk

    env:
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      KEY_VAULT_NAME: ${{ secrets.KEYVAULT_NAME }}

    steps:
      - name: Hent koden
        uses: actions/checkout@v5

      - name: Installer Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Logg inn i Azure
        uses: Azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialiser backend for dev
        run: |
          terraform init \
            -backend-config=../../shared/backend.hcl \
            -backend-config="key=dev/nettverk.tfstate"

      - name: Hent parameterfil for dev
        run: |
          az keyvault secret download \
            --vault-name "$KEY_VAULT_NAME" \
            --name nettverk-dev-tfvars \
            --file "$RUNNER_TEMP/nettverk.tfvars" \
            --encoding utf-8 \
            --output none

      - name: Lag plan for dev
        run: |
          terraform plan \
            -no-color \
            -var-file="$RUNNER_TEMP/nettverk.tfvars" \
            -var="environment=dev" \
            -out=tfplan > "$RUNNER_TEMP/plan.txt"

      - name: Kommenter planen på PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body-file "$RUNNER_TEMP/plan.txt"