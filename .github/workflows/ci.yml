name: ci

on:
    pull_request:
        branches:
            - main

permissions:
    contents: read           

jobs:
    validate:
        name: fmt og validate
        runs-on: ubuntu-latest
        steps:
            - name: Hent koden
              uses: actions/checkout@v5

            - name: Installer Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Sjekk formatering
              working-directory: oving6
              run: terraform fmt -check -recursive
            
            - name: Initialiser uten backend
              working-directory: oving6/stacks/nettverk
              run: terraform init -backend=false

            - name: Valider terraform
              working-directory: oving6/stacks/nettverk
              run: terraform validate
            
    plan:
        name: plan mot dev
        needs: validate
        runs-on: ubuntu-latest
        environment: dev

        permissions:
            id-token: write
            contents: read
            pull-requests: write
        
        defaults:
            run:
                shell: bash
                working-directory: oving6/stacks/nettverk
        
        env:
            TF_INPUT: "false"
            ARM_USE_OIDC: "true"
            ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
            KEY_VAULT_NAME: ${{ secrets.AZURE_KEY_VAULT_NAME }}
            
        steps:
            - name: Hent koden
              uses: actions/checkout@v5

            - name: Installer Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Logg inn i Azure
              uses: Azure/login@v3.1.0
              with:
                client-id: ${{ secrets.AZURE_CLIENT_ID }}
                tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
              
            - name: Lag plan for dev
              run:  
                terraform plan \
                  -no-color \
                  -var-file="RUNNER_TEMP/nettverk.tfvars" \
                  -var="environment=dev" \
                  -out=tfplan > "$RUNNER_TEMP/plan.txt"
                
            - name: Kommenter planen på PR
              env:
                GITHUB_TOKEN: ${{ github.token }}
                PR_NUMBER: ${{ github.event.pull_request.number }}
                run: |
                    gh pr comment "$PR NUMBER" \
                        --body-file "$RUNNER_TEMP/plan.txt"